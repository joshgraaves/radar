<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Radar">
<meta name="theme-color" content="#0b0d0e">
<title>Radar</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Barlow+Condensed:ital,wght@0,500;0,700;1,700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
/* Layout: the map fills the phone like the GTA V radar, heading-up and tilted; HUD sits on the edges, sheets slide up from the bottom. */
:root{
  --land:#2e3439; --land2:#353c42; --block:#3b4248; --park:#2b4433; --water:#3a6788; --road:#80868a; --road-major:#a9aeb1; --road-hi:#d3d6d8;
  --way:#b65cf0;     /* GTA waypoint purple */
  --hp:#3f9b49; --hp-bg:#1d3a21; --armor:#4c88c9; --armor-bg:#1c2f45;
  --ink:#ffffff; --muted:#b9c0c4; --panel:rgba(10,12,14,.86); --line:rgba(255,255,255,.14); --accent:#f0b429;
  --f-hud:"Oswald","Arial Narrow",Impact,sans-serif;
  --f-ui:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#0b0d0e;color:var(--ink);font-family:var(--f-ui);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit}
#map{position:fixed;inset:0;background:var(--land)}
/* radar mode: the map shrinks into a GTA-style rounded frame in the bottom left */
body.radar #map{inset:auto auto calc(58px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));width:min(62vw,300px);height:min(44vw,210px);border-radius:16px;border:3px solid #0b0d0e;box-shadow:0 0 0 1px rgba(255,255,255,.12),0 10px 30px rgba(0,0,0,.6);overflow:hidden}
.maplibregl-ctrl-attrib{font-size:9px;opacity:.55;background:rgba(0,0,0,.4)!important}
.maplibregl-ctrl-attrib a{color:#ddd!important}
body.radar .maplibregl-ctrl-attrib{display:none}

/* player blip: the white arrow from the radar, drawn on top of the map at the follow point */
#blip{position:fixed;left:50%;top:var(--blip-y,62%);width:30px;height:34px;transform:translate(-50%,-50%);pointer-events:none;z-index:3;filter:drop-shadow(0 1px 1px #000) drop-shadow(0 0 3px rgba(0,0,0,.8))}
#blip svg{width:100%;height:100%;transition:transform .25s}
body.radar #blip{left:calc(max(14px,env(safe-area-inset-left)) + min(62vw,300px)/2);top:auto;bottom:calc(58px + env(safe-area-inset-bottom) + min(44vw,210px)*.34);transform:translate(-50%,50%);width:22px;height:25px}
#blip.free{display:none}

/* north marker rides the edge of the screen like the radar's N */
#north{position:fixed;z-index:4;width:24px;height:24px;border-radius:50%;background:#0b0d0e;border:2px solid #d6d6d6;display:grid;place-items:center;font:700 12px/1 var(--f-hud);pointer-events:none}

/* HUD */
.hud{position:fixed;z-index:5;pointer-events:none;text-shadow:0 2px 2px #000,0 0 6px rgba(0,0,0,.9)}
#speed{left:max(16px,env(safe-area-inset-left));bottom:calc(30px + env(safe-area-inset-bottom));font-family:var(--f-hud);line-height:.85}
#speed b{font-size:64px;font-weight:700;letter-spacing:-1px;font-variant-numeric:tabular-nums}
#speed span{font-size:16px;font-weight:500;margin-left:4px;color:var(--muted)}
body.radar #speed{left:auto;right:max(16px,env(safe-area-inset-right));bottom:calc(64px + env(safe-area-inset-bottom));text-align:right}
body.radar #speed b{font-size:84px}
#street{right:max(16px,env(safe-area-inset-right));bottom:calc(34px + env(safe-area-inset-bottom));text-align:right;font-family:var(--f-ui);font-style:italic;font-weight:700;font-size:21px;max-width:62vw;line-height:1.05}
#street small{display:block;font-size:14px;color:var(--muted);font-style:normal;font-weight:500}
body.radar #street{bottom:calc(150px + env(safe-area-inset-bottom));max-width:calc(100% - 32px)}
/* the health / armor bars under the radar: green = speed (0–100 mph), blue = route progress or GPS accuracy */
#bars{position:fixed;z-index:5;left:max(16px,env(safe-area-inset-left));right:max(16px,env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr;gap:4px;pointer-events:none}
#bars i{display:block;height:7px;border:1px solid #000;position:relative;overflow:hidden}
#bars i::after{content:"";position:absolute;inset:0;transform-origin:left;transform:scaleX(var(--v,0));transition:transform .4s}
#hp{background:var(--hp-bg)} #hp::after{background:var(--hp)}
#ar{background:var(--armor-bg)} #ar::after{background:var(--armor)}
body.radar #bars{right:auto;width:min(62vw,300px);bottom:calc(46px + env(safe-area-inset-bottom))}

/* ride stats strip (radar mode shows it big; full mode shows it compact at the top) */
#stats{position:fixed;z-index:5;top:calc(12px + env(safe-area-inset-top));left:max(14px,env(safe-area-inset-left));display:flex;gap:14px;font-family:var(--f-hud);pointer-events:none;text-shadow:0 2px 2px #000,0 0 6px rgba(0,0,0,.9)}
#stats div{display:flex;flex-direction:column;line-height:1}
#stats b{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
#stats small{font-family:var(--f-ui);font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
#stats .rec{color:#ff4d4d}
body.radar #stats{top:calc(70px + env(safe-area-inset-top));flex-direction:column;gap:12px}
body.radar #stats b{font-size:30px}

/* buttons */
#tools{position:fixed;z-index:6;top:calc(12px + env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));display:flex;flex-direction:column;gap:8px}
.tb{width:48px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.tb svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tb.on{border-color:var(--accent);color:var(--accent)}
.tb.rec.on{border-color:#ff4d4d;color:#ff4d4d}
#recenter{position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(110px + env(safe-area-inset-bottom));padding:10px 18px;border-radius:99px;border:1px solid var(--line);background:var(--panel);font-weight:700;font-size:17px;letter-spacing:.04em;text-transform:uppercase;cursor:pointer}

/* route banner */
#routebar{position:fixed;z-index:6;left:max(14px,env(safe-area-inset-left));top:calc(64px + env(safe-area-inset-top));max-width:calc(100% - 96px);white-space:nowrap;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--way);border-radius:10px;padding:6px 12px;display:flex;gap:10px;align-items:center;font-size:16px;font-weight:700}
#routebar button{background:none;border:0;color:var(--muted);font-size:20px;line-height:1;cursor:pointer;padding:0 2px}
body.radar #routebar{top:auto;bottom:calc(66px + env(safe-area-inset-bottom) + min(44vw,210px))}
#rb-text{overflow:hidden;text-overflow:ellipsis}
/* map credit: kept small and clear of the speed and bars */
.maplibregl-ctrl-bottom-right{bottom:calc(118px + env(safe-area-inset-bottom))!important}

/* sheets */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45)}
.sheet{position:fixed;z-index:21;left:0;right:0;bottom:0;max-height:86%;overflow:auto;background:#121518;border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:16px max(18px,env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));font-size:17px;box-shadow:0 -10px 40px rgba(0,0,0,.6)}
@media (min-width:700px){.sheet{left:50%;right:auto;width:440px;transform:translateX(-50%)}}
.sheet h2{font-family:var(--f-hud);font-weight:700;font-size:26px;margin:0 0 4px;letter-spacing:.02em;text-transform:uppercase}
.sheet p{margin:0 0 12px;color:var(--muted);font-size:16px;line-height:1.35}
.grp{margin:14px 0}
.grp>label,.grp>.lbl{display:block;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:#0b0d0e;border-radius:10px;padding:4px}
.seg button{border:0;background:none;border-radius:7px;padding:10px 4px;font-weight:700;font-size:17px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:#2a3036;color:var(--ink)}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:8px;border:1px solid var(--line);background:#1d2226;border-radius:10px;padding:12px 16px;font-weight:700;font-size:18px;cursor:pointer;letter-spacing:.02em}
.btn.go{background:var(--way);border-color:var(--way);color:#fff}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1}
input[type=search]{width:100%;font:inherit;font-size:18px;color:var(--ink);background:#0b0d0e;border:1px solid var(--line);border-radius:10px;padding:12px}
.results{display:flex;flex-direction:column;margin-top:6px}
.results button{text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:10px 4px;cursor:pointer;font-size:16px}
.results button small{display:block;color:var(--muted);font-size:13px}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0;font-family:var(--f-hud)}
.summary div{background:#0b0d0e;border-radius:10px;padding:10px;display:flex;flex-direction:column}
.summary b{font-size:24px;font-variant-numeric:tabular-nums}
.summary small{font-family:var(--f-ui);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.msg{font-size:15px;color:var(--muted);min-height:20px}
.msg.err{color:#ff7a7a}
.ride{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding:10px 2px;font-size:16px}
.ride span{color:var(--muted)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0}
.toggle input{width:22px;height:22px;accent-color:var(--way)}
#toast{position:fixed;z-index:30;left:50%;transform:translateX(-50%);top:calc(70px + env(safe-area-inset-top));background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:16px;font-weight:700;max-width:calc(100% - 32px);text-align:center}
#gate{position:fixed;inset:0;z-index:40;background:radial-gradient(ellipse at 50% 30%,#22292e,#0b0d0e 70%);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:18px;padding:24px;text-align:center}
#gate h1{font-family:var(--f-hud);font-size:56px;margin:0;letter-spacing:.04em;text-transform:uppercase}
#gate p{margin:0;color:var(--muted);font-size:18px;max-width:30ch;line-height:1.35}
#gate .btn{min-width:220px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){#blip svg,#bars i::after{transition:none}}
</style>
</head>
<body>
<div id="map" aria-label="Map"></div>
<div id="blip" aria-hidden="true"><svg viewBox="0 0 30 34"><path d="M15 1 L28 32 L15 25 L2 32 Z" fill="#fff" stroke="#111" stroke-width="2" stroke-linejoin="round"/></svg></div>
<div id="north" aria-hidden="true">N</div>

<div id="stats" class="hud" aria-live="off"></div>
<div id="speed" class="hud"><b id="spd">0</b><span>MPH</span></div>
<div id="street" class="hud"><span id="st-name"></span><small id="st-area"></small></div>
<div id="bars" aria-hidden="true"><i id="hp"></i><i id="ar"></i></div>
<div id="routebar" hidden><span id="rb-text"></span><button id="rb-x" aria-label="Clear route">✕</button></div>
<button id="recenter" hidden>Recenter</button>

<div id="tools">
  <button class="tb" id="t-route" aria-label="Plan a fun ride"><svg viewBox="0 0 24 24"><circle cx="6" cy="19" r="2.5"/><path d="M8.5 19H16a3.5 3.5 0 0 0 0-7H8a3.5 3.5 0 0 1 0-7h7.5"/><path d="M18 5l2 0" /><circle cx="18" cy="5" r="2"/></svg></button>
  <button class="tb" id="t-gas" aria-label="Nearest gas"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="10" height="18" rx="1.5"/><path d="M7 7h4v4H7zM2.5 21h13M14 9h2a1.5 1.5 0 0 1 1.5 1.5V17a1.5 1.5 0 0 0 3 0V8l-3-3"/></svg></button>
  <button class="tb rec" id="t-rec" aria-label="Record ride"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg></button>
  <button class="tb" id="t-view" aria-label="Switch full map / radar"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><rect x="5.5" y="11" width="8" height="6.5" rx="1.5"/></svg></button>
  <button class="tb" id="t-more" aria-label="Rides and settings"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
</div>

<div id="gate">
  <h1>Radar</h1>
  <p>A GTA-style radar for riding around. Allow location when asked so the map can follow you.</p>
  <button class="btn go" id="g-start">Start riding</button>
  <button class="btn" id="g-demo">Try a demo ride</button>
  <p id="g-msg" class="msg"></p>
</div>
<div id="layer"></div>
<div id="toast" hidden></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
/* ---------------- settings & small helpers ---------------- */
const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem('radar.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('radar.'+k,JSON.stringify(v))}catch(e){}}};
const S={view:store.get('view','full'),tilt:store.get('tilt',true),zoom:store.get('zoom',16.2),avoidHw:store.get('avoidHw',true),rideMin:store.get('rideMin',45),dir:store.get('dir','any')};
const MPH=2.236936,MI=1609.344;
const toRad=d=>d*Math.PI/180,toDeg=r=>r*180/Math.PI;
function dist(a,b){const R=6371000,dLa=toRad(b[1]-a[1]),dLo=toRad(b[0]-a[0]),x=Math.sin(dLa/2)**2+Math.cos(toRad(a[1]))*Math.cos(toRad(b[1]))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function bearing(a,b){const y=Math.sin(toRad(b[0]-a[0]))*Math.cos(toRad(b[1])),x=Math.cos(toRad(a[1]))*Math.sin(toRad(b[1]))-Math.sin(toRad(a[1]))*Math.cos(toRad(b[1]))*Math.cos(toRad(b[0]-a[0]));return (toDeg(Math.atan2(y,x))+360)%360}
function dest(p,brg,m){const R=6371000,d=m/R,b=toRad(brg),la=toRad(p[1]),lo=toRad(p[0]),la2=Math.asin(Math.sin(la)*Math.cos(d)+Math.cos(la)*Math.sin(d)*Math.cos(b)),lo2=lo+Math.atan2(Math.sin(b)*Math.sin(d)*Math.cos(la),Math.cos(d)-Math.sin(la)*Math.sin(la2));return[toDeg(lo2),toDeg(la2)]}
const angDiff=(a,b)=>((b-a+540)%360)-180;
const fmtMin=s=>{const m=Math.round(s/60);return m>=60?`${Math.floor(m/60)}h ${m%60}m`:`${m} min`};
let toastT;function toast(t,ms=2600){const el=$('toast');el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,ms)}

/* ---------------- the GTA V radar map style ---------------- */
// Drawn from OpenFreeMap's free OpenStreetMap tiles; colors follow the game's radar: dark slate land,
// grey roads that get lighter as they get bigger, blue water, dark green parks, no labels.
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function radarStyle(){
  const w=(a,b)=>['interpolate',['exponential',1.6],['zoom'],10,a,18,b];
  const road=(id,classes,color,wLo,wHi,minz=0)=>({id,type:'line',source:'omt','source-layer':'transportation',minzoom:minz,filter:['in',['get','class'],['literal',classes]],layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':color,'line-width':w(wLo,wHi)}});
  return{version:8,
    sources:{omt:{type:'vector',url:'https://tiles.openfreemap.org/planet'}},
    layers:[
      {id:'bg',type:'background',paint:{'background-color':css('--land')}},
      {id:'landuse',type:'fill',source:'omt','source-layer':'landuse',filter:['in',['get','class'],['literal',['residential','commercial','industrial','retail']]],paint:{'fill-color':css('--land2')}},
      {id:'park',type:'fill',source:'omt','source-layer':'park',paint:{'fill-color':css('--park')}},
      {id:'green',type:'fill',source:'omt','source-layer':'landcover',filter:['in',['get','class'],['literal',['wood','grass','farmland']]],paint:{'fill-color':css('--park'),'fill-opacity':.85}},
      {id:'water',type:'fill',source:'omt','source-layer':'water',paint:{'fill-color':css('--water')}},
      {id:'waterway',type:'line',source:'omt','source-layer':'waterway',paint:{'line-color':css('--water'),'line-width':w(1,6)}},
      {id:'building',type:'fill',source:'omt','source-layer':'building',minzoom:14,paint:{'fill-color':css('--block'),'fill-opacity':.9}},
      road('r-path',['path','track'],'#4f565b',.4,2.2,14),
      road('r-minor',['minor','service'],css('--road'),.8,9,12),
      road('r-tert',['tertiary','secondary'],css('--road'),1.2,13,9),
      road('r-primary',['primary','trunk'],css('--road-major'),1.6,16,7),
      road('r-motorway',['motorway'],css('--road-hi'),2,18,5),
      {id:'rail',type:'line',source:'omt','source-layer':'transportation',filter:['==',['get','class'],'rail'],paint:{'line-color':'#5a5f63','line-width':w(.5,2),'line-dasharray':[3,3]}},
      // invisible road names: used to show the street you're on, GTA style, without labels on the map
      {id:'names',type:'line',source:'omt','source-layer':'transportation_name',paint:{'line-opacity':0,'line-width':12}},
    ]};
}

/* ---------------- map ---------------- */
const START=store.get('last',[-87.6324,41.8853]);
const map=new maplibregl.Map({container:'map',style:radarStyle(),center:START,zoom:S.zoom,pitch:S.tilt?55:0,bearing:0,attributionControl:{compact:true},dragRotate:true,pitchWithRotate:false,maxPitch:70,fadeDuration:0});
map.touchZoomRotate.enableRotation();
map.on('load',()=>{
  map.addSource('route',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
  map.addSource('trail',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
  map.addLayer({id:'trail',type:'line',source:'trail',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#f0b429','line-opacity':.55,'line-width':['interpolate',['linear'],['zoom'],10,2,18,6]}});
  map.addLayer({id:'route-case',type:'line',source:'route',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#2a0d3d','line-width':['interpolate',['linear'],['zoom'],10,5,18,16]}});
  map.addLayer({id:'route',type:'line',source:'route',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':css('--way'),'line-width':['interpolate',['linear'],['zoom'],10,3,18,11]}});
  // gas station blips straight from the map tiles (OpenStreetMap amenity=fuel), drawn like the radar's pump icon
  map.addImage('pump',pumpIcon(),{pixelRatio:2});
  map.addLayer({id:'gas',type:'symbol',source:'omt','source-layer':'poi',minzoom:12.5,filter:['all',['==',['get','class'],'fuel'],['!=',['get','subclass'],'charging_station']],
    layout:{'icon-image':'pump','icon-size':['interpolate',['linear'],['zoom'],12.5,.75,17,1.15],'icon-allow-overlap':true,'icon-pitch-alignment':'viewport','icon-rotation-alignment':'viewport'}});
  if(route)showRoute();
  // keep the map credit folded into its (i) button so it doesn't cover the road
  const at=document.querySelector('.maplibregl-ctrl-attrib');if(at)at.classList.remove('maplibregl-compact-show');
});
// follow mode: the camera rides with you (heading up); touching the map pauses it until Recenter
let follow=true;
const stopFollow=()=>{if(follow){follow=false;$('recenter').hidden=false;$('blip').classList.add('free');addMe()}};
map.on('dragstart',e=>{if(e.originalEvent)stopFollow()});
map.on('rotatestart',e=>{if(e.originalEvent)stopFollow()});
$('recenter').onclick=()=>{follow=true;$('recenter').hidden=true;$('blip').classList.remove('free');removeMe();if(me)camera(true)};
// when following, the blip is drawn as an overlay; when panning around, a map marker shows where you are
let meMarker=null;
function addMe(){if(!me||meMarker)return;const el=document.createElement('div');el.innerHTML=$('blip').innerHTML;el.style.cssText='width:26px;height:30px;filter:drop-shadow(0 0 3px #000)';meMarker=new maplibregl.Marker({element:el,rotationAlignment:'map',pitchAlignment:'map',rotation:me.heading}).setLngLat(me.pos).addTo(map)}
function removeMe(){if(meMarker){meMarker.remove();meMarker=null}}

function layoutCamera(){
  // keep the player low on the screen so you see more road ahead, like the radar
  const h=$('map').clientHeight;map.setPadding({top:Math.round(h*(S.view==='radar'?.32:.38)),bottom:0,left:0,right:0});
  document.documentElement.style.setProperty('--blip-y',(50+(S.view==='radar'?16:19))+'%');
}
function camera(jump){
  if(!me||!follow)return;
  const z=speedZoom();
  const o={center:me.pos,bearing:me.heading,zoom:z,pitch:S.tilt?55:0};
  if(jump)map.jumpTo(o);else map.easeTo({...o,duration:950,easing:t=>t});
}
// zoom out a little as you go faster, like the radar does when driving fast
function speedZoom(){const mph=me?me.mph:0;return S.zoom-Math.min(1.6,Math.max(0,(mph-20)/30))}

/* ---------------- GPS ---------------- */
let me=null,watchId=null,lastFix=0,demo=null;
function onPos(p){
  const pos=[p.coords.longitude,p.coords.latitude],now=p.timestamp||Date.now();
  let mph=p.coords.speed!=null&&p.coords.speed>=0?p.coords.speed*MPH:null,heading=p.coords.heading;
  if(me){const d=dist(me.pos,pos),dt=(now-me.t)/1000;if(mph==null&&dt>0)mph=d/dt*MPH;if((heading==null||isNaN(heading))&&d>3)heading=bearing(me.pos,pos)}
  if(heading==null||isNaN(heading)||(mph||0)<2)heading=me?me.heading:0; // hold the heading when stopped
  me={pos,mph:Math.max(0,mph||0),heading,acc:p.coords.accuracy||0,t:now};lastFix=Date.now();
  store.set('last',pos);
  if(meMarker){meMarker.setLngLat(pos).setRotation(heading)}
  ride.add(me);camera(false);hud();
}
function onErr(e){
  const m=e.code===1?'Location is blocked. On iPhone: Settings › Privacy & Security › Location Services › Safari Websites › While Using.':e.code===3?'Still looking for GPS…':'Can’t get your location right now.';
  $('g-msg').textContent=m;$('g-msg').className='msg err';if(e.code!==3)toast(m,5000);
}
function startGps(){
  if(!navigator.geolocation){onErr({code:2});return}
  watchId=navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,maximumAge:0,timeout:15000});
}

/* ---------------- HUD ---------------- */
let lastStreetAt=0;
function hud(){
  const mph=me?me.mph:0;$('spd').textContent=Math.round(mph);
  $('hp').style.setProperty('--v',Math.min(1,mph/100).toFixed(3));
  // blue bar: progress along the planned route, or GPS quality when there's no route
  const ar=route&&me?routeProgress():me?Math.max(.1,1-Math.min(1,me.acc/60)):0;$('ar').style.setProperty('--v',ar.toFixed(3));
  if(follow)$('blip').querySelector('svg').style.transform=`rotate(${me?me.heading-map.getBearing():0}deg)`;
  if(Date.now()-lastStreetAt>1500){lastStreetAt=Date.now();streetName()}
  stats();north();
}
function streetName(){
  if(!me||!map.isStyleLoaded())return;
  const p=map.project(me.pos),box=[[p.x-14,p.y-14],[p.x+14,p.y+14]];
  const f=map.queryRenderedFeatures(box,{layers:['names']}).filter(f=>f.properties.name);
  if(f.length){
    // prefer the road that runs the way you're heading
    $('st-name').textContent=f[0].properties.name;
    const other=f.find(x=>x.properties.name!==f[0].properties.name);$('st-area').textContent=other?other.properties.name:'';
  }
}
function north(){
  const el=$('north'),r=el.getBoundingClientRect(),W=innerWidth,H=innerHeight,b=toRad(-map.getBearing());
  let cx,cy,rx,ry;
  if(S.view==='radar'){const m=$('map').getBoundingClientRect();cx=m.left+m.width/2;cy=m.top+m.height/2;rx=m.width/2-4;ry=m.height/2-4}
  else{cx=W/2;cy=H/2;rx=W/2-24;ry=H/2-110}
  const x=cx+Math.sin(b)*rx,y=cy-Math.cos(b)*ry;el.style.left=(x-12)+'px';el.style.top=(y-12)+'px';
}
map.on('rotate',()=>{north();if(me&&follow)$('blip').querySelector('svg').style.transform=`rotate(${me.heading-map.getBearing()}deg)`});

/* ---------------- ride recording ---------------- */
const ride={on:false,pts:[],start:0,miles:0,top:0,movingS:0,
  begin(){this.on=true;this.pts=[];this.start=Date.now();this.miles=0;this.top=0;this.movingS=0;$('t-rec').classList.add('on');setTrail();toast('Recording ride')},
  add(p){if(!this.on)return;const last=this.pts[this.pts.length-1];
    if(last){const d=dist(last.pos,p.pos);if(d<4)return;if(p.acc>50)return;this.miles+=d/MI;if(p.mph>3)this.movingS+=(p.t-last.t)/1000}
    this.top=Math.max(this.top,p.mph);this.pts.push({pos:p.pos,t:p.t,mph:p.mph});if(this.pts.length%3===0)setTrail()},
  end(){if(!this.on)return;this.on=false;$('t-rec').classList.remove('on');
    if(this.miles>.1){const rides=store.get('rides',[]);rides.unshift({at:this.start,miles:+this.miles.toFixed(2),top:Math.round(this.top),mins:Math.round((Date.now()-this.start)/60000),avg:this.movingS?+(this.miles/(this.movingS/3600)).toFixed(1):0,path:simplify(this.pts.map(p=>p.pos))});store.set('rides',rides.slice(0,40));toast(`Saved: ${this.miles.toFixed(1)} mi, top ${Math.round(this.top)} mph`)}
    else toast('Ride too short to save');stats()}};
function simplify(pts){const out=[];let last=null;for(const p of pts){if(!last||dist(last,p)>25){out.push([+p[0].toFixed(5),+p[1].toFixed(5)]);last=p}}return out.slice(0,3000)}
function setTrail(){const s=map.getSource('trail');if(s)s.setData({type:'Feature',geometry:{type:'LineString',coordinates:ride.pts.map(p=>p.pos)}})}
function stats(){
  const el=$('stats');
  if(!ride.on){el.innerHTML=route?`<div><b>${(route.miles*(1-routeProgress())).toFixed(1)}</b><small>mi left</small></div>`:'';return}
  const mins=(Date.now()-ride.start)/60000;
  el.innerHTML=`<div><b class="rec">● ${Math.floor(mins)}:${String(Math.floor(mins%1*60)).padStart(2,'0')}</b><small>time</small></div><div><b>${ride.miles.toFixed(1)}</b><small>miles</small></div><div><b>${Math.round(ride.top)}</b><small>top mph</small></div>`;
}
setInterval(()=>{if(ride.on)stats();if(me&&Date.now()-lastFix>20000&&!demo)$('st-area').textContent='Weak GPS signal'},1000);

/* ---------------- fun ride routes ---------------- */
// Valhalla (free, OpenStreetMap) with its motorcycle profile: we nudge it off highways and big roads toward
// smaller, curvier ones. A loop ride is planned through a few points on a circle around you.
let route=null;
const VALHALLA='https://valhalla1.openstreetmap.de/route';
function decode6(s){let i=0,lat=0,lon=0;const out=[];while(i<s.length){for(const k of[0,1]){let r=0,sh=0,b;do{b=s.charCodeAt(i++)-63;r|=(b&31)<<sh;sh+=5}while(b>=32);const d=r&1?~(r>>1):r>>1;if(k===0)lat+=d;else lon+=d}out.push([lon/1e6,lat/1e6])}return out}
async function valhalla(locs){
  const body={locations:locs.map((p,i)=>({lon:p[0],lat:p[1],type:i===0||i===locs.length-1?'break':'through'})),costing:'motorcycle',units:'miles',
    costing_options:{motorcycle:{use_highways:S.avoidHw?0:.5,use_tolls:0,use_trails:0,use_primary:S.avoidHw?.2:.5,shortest:false}},directions_options:{units:'miles'}};
  const r=await fetch(VALHALLA,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json();if(!r.ok||!j.trip)throw new Error(j.error||'No route found');
  const coords=j.trip.legs.flatMap(l=>decode6(l.shape));
  return{coords,miles:j.trip.summary.length,secs:j.trip.summary.time};
}
const DIRS={any:null,N:0,E:90,S:180,W:270};
async function planLoop(){
  const here=me?me.pos:map.getCenter().toArray();
  // ride length from minutes at ~19 mph average (what the router expects on back roads); roads run ~1.3x longer than the circle
  const miles=S.rideMin/60*19,R=miles*MI/(2*Math.PI)/1.3;
  const head=DIRS[S.dir]??Math.random()*360,back=(head+180)%360,n=4,sweep=Math.random()<.5?1:-1;
  const jit=[...Array(n)].map(()=>[Math.random()*24-12,0.85+Math.random()*.3]);
  const loop=r=>{const center=dest(here,head,r),pts=[here];for(let i=1;i<=n;i++)pts.push(dest(center,back+sweep*i*360/(n+1)+jit[i-1][0],r*jit[i-1][1]));pts.push(here);return valhalla(pts)};
  // city streets are slow: if the first try runs long, shrink the circle to fit the time you picked
  let r=await loop(R);const want=S.rideMin*60;if(r.secs>want*1.3)r=await loop(R*Math.max(.35,want/r.secs));
  return r;
}
async function planTo(target){const here=me?me.pos:map.getCenter().toArray();return valhalla([here,target])}
function showRoute(){const s=map.getSource('route');if(s)s.setData(route?{type:'Feature',geometry:{type:'LineString',coordinates:route.coords}}:{type:'FeatureCollection',features:[]});
  $('routebar').hidden=!route;if(route)$('rb-text').textContent=`${route.name} · ${route.miles.toFixed(1)} mi · ${fmtMin(route.secs)}`;stats()}
// progress only moves forward along the route, so a loop that ends where it starts doesn't read as finished
function routeProgress(){if(!route||!me)return 0;const c=route.coords;route.idx=route.idx||0;let best=1e12,bi=route.idx;
  for(let i=route.idx;i<Math.min(c.length,route.idx+400);i++){const d=dist(c[i],me.pos);if(d<best){best=d;bi=i}}
  if(best<80)route.idx=bi;return route.idx/(c.length-1)}
$('rb-x').onclick=()=>{route=null;showRoute();toast('Route cleared')};
function fit(coords){const b=coords.reduce((b,c)=>b.extend(c),new maplibregl.LngLatBounds(coords[0],coords[0]));stopFollow();map.fitBounds(b,{padding:{top:80,bottom:260,left:40,right:70},pitch:0,bearing:0,duration:800})}

/* ---------------- gas stations ---------------- */
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function pumpIcon(){
  const s=48,c=document.createElement('canvas');c.width=c.height=s;const g=c.getContext('2d');
  g.fillStyle='#0b0d0e';g.beginPath();g.arc(24,24,21,0,7);g.fill();g.lineWidth=2.5;g.strokeStyle='rgba(255,255,255,.8)';g.stroke();
  g.fillStyle='#fff';g.fillRect(15,13,12,22);g.fillRect(12.5,33,17,3);g.fillStyle='#0b0d0e';g.fillRect(17.5,16,7,6);
  g.strokeStyle='#fff';g.lineWidth=2.4;g.lineCap='round';g.lineJoin='round';g.beginPath();g.moveTo(27,20);g.lineTo(31,20);g.quadraticCurveTo(32.5,20,32.5,22);g.lineTo(32.5,29);g.quadraticCurveTo(32.5,31.5,34.5,31.5);g.quadraticCurveTo(36.5,31.5,36.5,29);g.lineTo(36.5,18);g.lineTo(34,15.5);g.stroke();
  return g.getImageData(0,0,s,s);
}
// two sources: the stations already in the loaded map tiles (instant), plus OpenStreetMap's Overpass API for a wider
// search (often slow), which fills in more when it answers
const gas={list:[],at:null};
function gasFromTags(t,pos){return{pos,name:t.brand||t.name||'Gas station',addr:[t['addr:housenumber'],t['addr:street']].filter(Boolean).join(' ')||t['addr:city']||'',h24:t.opening_hours==='24/7'}}
const gasKey=g=>g.pos.map(v=>v.toFixed(3)).join();
function dedupe(list){const seen=new Set();return list.filter(g=>{const k=gasKey(g);return seen.has(k)?false:seen.add(k)})}
function tileGas(){
  try{return dedupe(map.querySourceFeatures('omt',{sourceLayer:'poi',filter:['all',['==',['get','class'],'fuel'],['!=',['get','subclass'],'charging_station']]})
    .filter(f=>f.geometry.type==='Point').map(f=>gasFromTags(f.properties,f.geometry.coordinates)))}catch(e){return[]}
}
async function overpassGas(c){
  if(gas.at&&dist(gas.at,c)<3000)return gas.list;
  const q=`[out:json][timeout:25];nwr["amenity"="fuel"](around:12000,${c[1].toFixed(5)},${c[0].toFixed(5)});out center tags 200;`;
  const ac=new AbortController(),t=setTimeout(()=>ac.abort(),45000);
  try{const r=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'data='+encodeURIComponent(q),signal:ac.signal});
    if(!r.ok)throw new Error('busy');const j=await r.json();
    gas.list=j.elements.map(e=>gasFromTags(e.tags||{},e.center?[e.center.lon,e.center.lat]:[e.lon,e.lat])).filter(g=>isFinite(g.pos[0]));gas.at=c;return gas.list}
  finally{clearTimeout(t)}
}
function rideTo(g,close){return planTo(g.pos).then(r=>{route={...r,kind:'Trip',name:g.name};showRoute();close();follow=true;$('recenter').hidden=true;$('blip').classList.remove('free');removeMe();camera(true)})}
function gasSheet(only){
  const here=me?me.pos:map.getCenter().toArray();
  openSheet(`<h2>Gas</h2><p class="msg" id="g-m">${only?'':'Finding gas stations near you…'}</p><div class="results" id="g-res"></div><div class="row" style="margin-top:10px"><button class="btn" data-close>Close</button></div>`,async(root,close)=>{
    const msg=(t,e)=>{const m=root.querySelector('#g-m');m.textContent=t;m.className='msg'+(e?' err':'')};
    let near=[],picked=false;
    const render=(list,searching)=>{
      near=dedupe(list).map(g=>({...g,d:dist(here,g.pos)})).sort((a,b)=>a.d-b.d).slice(0,8);
      if(picked)return;
      root.querySelector('#g-res').innerHTML=near.map((g,i)=>`<button data-i="${i}">${esc(g.name)} · ${(g.d/MI).toFixed(1)} mi<small>${esc(g.addr)||'&nbsp;'}${g.h24?' · open 24/7':''}</small></button>`).join('');
      root.querySelectorAll('#g-res [data-i]').forEach(b=>b.onclick=()=>{picked=true;msg('Finding a way there…');rideTo(near[+b.dataset.i],close).catch(e=>{picked=false;msg(e.message==='Failed to fetch'?'Can’t reach the route planner. Check your connection.':e.message,true)})});
      msg(only?'Tap to ride there.':near.length?`Closest first (straight-line miles). Tap one to ride there.${searching?' Looking farther out…':''}`:searching?'Finding gas stations near you…':'No gas stations found nearby.',!near.length&&!searching);
    };
    if(only){render([only]);return}
    const quick=tileGas();render(quick,true);
    overpassGas(here).then(l=>render([...quick,...l],false)).catch(()=>{if(!picked)msg(near.length?'Closest first (straight-line miles). Tap one to ride there.':'Can’t search for gas right now. Zoom out on the map to load more, or try again in a minute.',!near.length)});
  });
}
$('t-gas').onclick=()=>gasSheet();
map.on('click','gas',e=>{const f=e.features[0];gasSheet(gasFromTags(f.properties,f.geometry.coordinates))});
map.on('mouseenter','gas',()=>map.getCanvas().style.cursor='pointer');map.on('mouseleave','gas',()=>map.getCanvas().style.cursor='');

/* ---------------- sheets ---------------- */
function openSheet(html,onReady){const L=$('layer');L.innerHTML=`<div class="scrim"></div><div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  const close=()=>{L.innerHTML=''};L.querySelector('.scrim').onclick=close;L.querySelectorAll('[data-close]').forEach(b=>b.onclick=close);onReady&&onReady(L.querySelector('.sheet'),close);return close}
const seg=(key,opts)=>`<div class="seg" role="group">${opts.map(([v,l])=>`<button data-set="${key}" data-v="${v}" aria-pressed="${String(S[key])===String(v)}">${l}</button>`).join('')}</div>`;
function wireSeg(root,after){root.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>{const k=b.dataset.set,v=b.dataset.v;S[k]=isNaN(+v)?v:+v;store.set(k,S[k]);root.querySelectorAll(`[data-set="${k}"]`).forEach(x=>x.setAttribute('aria-pressed',x===b));after&&after(k)})}

  root.querySelector('#f-go').onclick=()=>{if(!draft)return;route={...draft};showRoute();close();follow=true;$('recenter').hidden=true;$('blip').classList.remove('free');removeMe();camera(true);if(!ride.on)ride.begin()};
  // place search: OpenStreetMap's Nominatim, near where you are

    }catch(err){root.querySelector('#f-res').innerHTML='<p class="msg err">Search isn’t reachable right now.</p>'}},450)};

/* ---------------- demo ride (for trying it on a computer, or indoors) ---------------- */
// drives along the planned route if there is one, otherwise a loop through Chicago's Loop, at ~30 mph
function startDemo(){
  if(watchId!=null){navigator.geolocation.clearWatch(watchId);watchId=null}
  const path=route?route.coords:[[-87.6324,41.8853],[-87.6324,41.8786],[-87.6390,41.8786],[-87.6390,41.8853],[-87.6260,41.8853],[-87.6260,41.8920],[-87.6324,41.8920],[-87.6324,41.8853]];
  let i=0,f=0,pos=path[0];const mps=30/MPH;
  demo=setInterval(()=>{let left=mps;while(left>0&&i<path.length-1){const seg=dist(path[i],path[i+1]),rem=seg*(1-f);if(left<rem){f+=left/seg;left=0}else{left-=rem;i++;f=0}}
    if(i>=path.length-1){i=0;f=0}const a=path[i],b=path[i+1];pos=[a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f];
    onPos({coords:{longitude:pos[0],latitude:pos[1],speed:mps*(0.85+Math.random()*.3),heading:bearing(a,b),accuracy:6},timestamp:Date.now()})},1000);
  toast('Demo ride: driving a loop at 30 mph');
}
function stopDemo(){clearInterval(demo);demo=null;startGps();toast('Back to your real location')}

/* ---------------- start ---------------- */
let wake=null;async function keepAwake(){try{wake=await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&wake!==null)keepAwake()});
function go(isDemo){$('gate').hidden=true;keepAwake();applyView();layoutCamera();isDemo?startDemo():startGps()}
$('g-start').onclick=()=>go(false);$('g-demo').onclick=()=>go(true);
// skip the start screen when the app opens with #demo (for testing) or after the first time
if(location.hash==='#demo')go(true);else if(store.get('started',false)&&navigator.geolocation)go(false);
$('g-start').addEventListener('click',()=>store.set('started',true));
addEventListener('resize',()=>{layoutCamera();north()});
layoutCamera();north();hud();
</script>
